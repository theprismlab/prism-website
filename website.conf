server {
    listen 8080;
    client_max_body_size 5000M; # It allows files below 100Mb, change it based on your use
    location / {
        alias /cmap/prism/PRISM-website/dist/; # Corrected path
        index index.html; # Add this line to serve index.html
        try_files $uri $uri/ /index.html =404;
    }

    # Same-origin proxy for the PRISM submission-instructions PDFs. These are
    # fetched cross-origin by pdf.js (via fetch()) to build the scroll-to-section
    # outline, and assets.clue.io's CloudFront distribution intermittently serves
    # cached responses missing Access-Control-Allow-Origin (its cache key doesn't
    # vary on the Origin header). Proxying same-origin sidesteps CORS entirely.
    location /pdf-assets/ {
        proxy_ssl_server_name on;
        proxy_set_header Host assets.clue.io;
        proxy_pass https://assets.clue.io/;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}